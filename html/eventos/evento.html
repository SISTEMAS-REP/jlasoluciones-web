<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tituloPagina">Evento</title>

<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/evento.css">
</head>

<body>

<!-- CABECERA MODERNA -->
<header class="topbar">
    <img id="logoEmpresa" class="logo" alt="Logo Empresa">
    <h1 id="tituloEvento"></h1>
</header>

<main class="container">

    <!-- AGENDA LATERAL -->
    <aside class="agenda-area">
        <h2>Agenda</h2>
        <ul id="agendaLista"></ul>
    </aside>

    <!-- VIDEO PRINCIPAL -->
    <div class="video-area">
        <video
            id="liveStream"
            class="video-js vjs-big-play-centered"
            controls
            autoplay
            muted
            playsinline
        ></video>
    </div>

</main>

<!-- CHAT -->
<div class="chat-area" id="chatArea">
    <!-- Mensajes se cargarán aquí -->
</div>

<!-- GRABACIONES -->
<div class="recordings-area" id="recordingsArea">
    <h2>Grabaciones</h2>
    <ul id="recordingsList"></ul>
</div>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="/assets/js/evento.js"></script>
</body>
</html>
