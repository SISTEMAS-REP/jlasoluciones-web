<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tituloPagina">Evento</title>

<!-- Video.js -->
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/evento.css">
</head>

<body>

<header class="topbar">
    <div class="left">
        <img id="logoEmpresa" class="logo" alt="Logo Empresa">
        <h1 id="tituloEvento">Evento Demo JLA</h1>
    </div>
    <div class="right-icons">
        <button class="icon-btn" title="Notificaciones">🔔</button>
        <button class="icon-btn" title="Configuración">⚙️</button>
        <button class="icon-btn" title="Perfil">👤</button>
    </div>
</header>

<main class="container">

    <!-- VIDEO PRINCIPAL -->
    <div class="video-area">
        <video
            id="liveStream"
            class="video-js vjs-big-play-centered"
            controls
            autoplay
            muted
            playsinline
        ></video>

        <!-- Botones flotantes al lado derecho -->
        <div class="video-buttons">
            <button class="video-btn" title="Chat">💬</button>
            <button class="video-btn" title="Grabaciones">📹</button>
            <button class="video-btn" title="Compartir">🔗</button>
        </div>
    </div>

    <!-- CHAT -->
    <div class="chat-area">
        <h2>Chat en Vivo</h2>
        <div id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatText" placeholder="Escribe tu mensaje...">
            <button id="sendChat">Enviar</button>
        </div>
    </div>

    <!-- TABS INFERIORES -->
    <div class="tabs-container">
        <div class="tabs">
            <button class="tab-btn active" data-tab="agendaTab">Agenda</button>
            <button class="tab-btn" data-tab="grabacionesTab">Grabaciones</button>
        </div>
        <div id="agendaTab" class="tab-content active">
            <ul id="agendaLista"></ul>
        </div>
        <div id="grabacionesTab" class="tab-content">
            <ul id="grabacionesLista"></ul>
        </div>
    </div>

</main>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="/assets/js/evento.js"></script>
<script src="/assets/js/chat.js"></script>
</body>
</html>
