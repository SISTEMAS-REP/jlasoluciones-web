<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tituloPagina">Evento</title>

<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/evento.css">

</head>
<body>

<header class="topbar">
    <img id="logoEmpresa" class="logo" alt="Logo Empresa">
    <h1 id="tituloEvento"></h1>
</header>

<main class="container">

    <!-- VIDEO AREA -->
    <div class="video-area">
        <video
            id="liveStream"
            class="video-js vjs-big-play-centered"
            controls
            autoplay
            muted
            playsinline
        ></video>

        <!-- OVERLAY STREAM OFF -->
        <div id="offlineOverlay">
            <div class="spinner"></div>
            La transmisión comenzará en breve...
        </div>

        <!-- LIVE BADGE -->
        <div id="liveBadge">EN VIVO</div>

        <!-- FLOATING CHAT -->
        <div id="floatingChat"></div>

        <!-- CONTADOR DE VIEWERS -->
        <div id="viewerCount">0 espectadores</div>
    </div>

    <!-- AGENDA -->
    <aside class="agenda-area">
        <h2>Agenda</h2>
        <ul id="agendaLista"></ul>
    </aside>

</main>

<!-- RECURSOS -->
<div class="resources-area">
    <div class="tabs">
        <button class="tab-button active" data-tab="grabaciones">Grabaciones</button>
        <button class="tab-button" data-tab="materiales">Materiales</button>
    </div>
    <div class="tab-content" id="grabaciones">
        <ul id="recordingsList"></ul>
    </div>
    <div class="tab-content" id="materiales" style="display:none;">
        <ul id="materialsList"></ul>
    </div>
</div>

<footer>
    © 2026 JLA Solutions Labs. Todos los derechos reservados.
</footer>

<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>
<script src="/assets/js/evento.js"></script>
<script src="/assets/js/chat.js"></script>
<script src="/assets/js/resources.js"></script>

</body>
</html>
