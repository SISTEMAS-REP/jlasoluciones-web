
user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Virtual Host Configs
	##
	
    # ==========================
    # SERVER PARA ESTADÍSTICAS RTMP
    # ==========================
    server {
        listen 8080;

	location /stat {
		rtmp_stat all;
		rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
                root /usr/share/nginx/html;
        }
     }


	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
        
	# Reducir informacón enviada oara mayor seguridad
	server_tokens off;

	# Tamaño maximo de archivos en el servidor
	client_max_body_size 10M;

	# Ajustes de cache SSL (cuando https este habilitado)
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 10m;

	# Habilitar compresion GZIP 
	gzip on;
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
	gzip_proxied any;
	gzip_min_length 1000;
	gzip_comp_level 5;
	gzip_vary on;

	# Tiempo máximo de keep-alive para rendimiento
	keepalive_timeout 65;
}

rtmp {
     server{
	 listen 1935; 
	 chunk_size 4096;

	 application live{
	        live on;  
		record off;
		hls on;
		hls_path /var/www/hls;
		hls_fragment 3;
		hls_playlist_length 30;
		hls_cleanup on;
	} 
    }	

}


